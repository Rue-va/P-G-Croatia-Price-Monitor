<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&G Croatia — Retail Price &amp; Assortment Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --pg-blue: #004b93;
    --bg: #f4f6f8;
    --card: #ffffff;
    --border: #dfe3e8;
    --text: #1c1f24;
    --muted: #6b7480;
    --danger: #c0392b;
    --danger-bg: #fdecea;
    --ok: #1e8e3e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--pg-blue);
    color: white;
    padding: 20px 28px;
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab-btn {
    padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
    background: white; cursor: pointer; font-size: 14px; color: var(--text);
  }
  .tab-btn.active { background: var(--pg-blue); color: white; border-color: var(--pg-blue); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px;
  }
  .card .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .card .value { font-size: 26px; font-weight: 600; margin-top: 4px; }
  .card .value.warn { color: var(--danger); }
  .section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 22px; }
  .section h2 { margin: 0 0 12px; font-size: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tr:hover td { background: #fafbfc; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .badge.danger { background: var(--danger-bg); color: var(--danger); }
  .status-line { font-size: 12px; color: var(--muted); margin-top: -8px; margin-bottom: 18px; }
  .status-pill { padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 6px; }
  .status-ok { background: #e6f4ea; color: var(--ok); }
  .status-stale { background: #fff4e5; color: #b06000; }
  .status-error { background: var(--danger-bg); color: var(--danger); }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
  canvas { max-height: 320px; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 20px; }
</style>
</head>
<body>
<header>
  <h1>P&amp;G Croatia — Retail Price &amp; Assortment Monitor</h1>
  <p id="generated-line">Loading…</p>
</header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
</main>
<footer>
  Data source: retailers' legally-mandated public daily price lists (NN 75/2025). "Flagged" items are inferred as
  likely out of stock from N+ consecutive days missing from the published price list — this is not real warehouse
  inventory data.
</footer>

<script>
let dashboardData = null;
let activeRetailer = null;
let chartInstance = null;

async function loadData() {
  try {
    const res = await fetch('data.json?_=' + Date.now());
    dashboardData = await res.json();
    render();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="section"><p class="empty">Could not load data.json. If this is the first run, the daily job may not have completed yet.</p></div>';
  }
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function render() {
  const genLine = document.getElementById('generated-line');
  genLine.textContent = `Updated ${fmtDate(dashboardData.as_of_date)} · flags after ${dashboardData.missing_days_threshold}+ consecutive missing days`;

  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  dashboardData.retailers.forEach((r, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.textContent = r.retailer.charAt(0).toUpperCase() + r.retailer.slice(1);
    btn.onclick = () => selectRetailer(r.retailer, btn);
    tabs.appendChild(btn);
  });

  if (dashboardData.retailers.length) {
    activeRetailer = dashboardData.retailers[0].retailer;
    renderRetailer(activeRetailer);
  }
}

function selectRetailer(name, btnEl) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  activeRetailer = name;
  renderRetailer(name);
}

function statusPill(status) {
  if (status === 'ok') return '<span class="status-pill status-ok">up to date</span>';
  if (status === 'stale') return '<span class="status-pill status-stale">showing last good data</span>';
  return '<span class="status-pill status-error">crawl failed</span>';
}

function renderRetailer(name) {
  const r = dashboardData.retailers.find(x => x.retailer === name);
  const content = document.getElementById('content');
  if (!r) { content.innerHTML = '<div class="section"><p class="empty">No data.</p></div>'; return; }

  if (r.status === 'error') {
    content.innerHTML = `
      <div class="section">
        <h2>${name.charAt(0).toUpperCase() + name.slice(1)} ${statusPill(r.status)}</h2>
        <p class="empty">The crawler could not reach ${name}'s price list today, and there's no earlier snapshot to fall back on yet.</p>
        <p class="empty" style="font-family:monospace;">${(r.error || '').slice(0, 300)}</p>
      </div>`;
    return;
  }

  const cats = Object.entries(r.category_stats || {})
    .filter(([, v]) => v.pg_count > 0)
    .sort((a, b) => b[1].pg_count - a[1].pg_count)
    .slice(0, 10);

  content.innerHTML = `
    <p class="status-line">Last updated ${fmtDate(r.last_updated)} ${statusPill(r.status)}</p>
    <div class="cards">
      <div class="card"><div class="label">Total catalog size</div><div class="value">${r.total_catalog_size.toLocaleString()}</div></div>
      <div class="card"><div class="label">P&amp;G products tracked</div><div class="value">${r.pg_products_tracked.toLocaleString()}</div></div>
      <div class="card"><div class="label">Stores covered</div><div class="value">${r.stores_count.toLocaleString()}</div></div>
      <div class="card"><div class="label">Flagged missing ${dashboardData.missing_days_threshold}+ days</div><div class="value ${r.flagged_count > 0 ? 'warn' : ''}">${r.flagged_count.toLocaleString()}</div></div>
    </div>

    <div class="section">
      <h2>P&amp;G vs. category average price (top categories by P&amp;G presence)</h2>
      <canvas id="priceChart"></canvas>
    </div>

    <div class="section">
      <h2>Flagged: likely out of stock (missing ${dashboardData.missing_days_threshold}+ consecutive published days)</h2>
      ${renderFlaggedTable(r.flagged_items)}
    </div>
  `;

  renderChart(cats);
}

function renderFlaggedTable(items) {
  if (!items || !items.length) {
    return '<p class="empty">Nothing flagged right now.</p>';
  }
  const rows = items.map(it => `
    <tr>
      <td>${escapeHtml(it.product)}</td>
      <td>${escapeHtml(it.brand)}</td>
      <td>${escapeHtml(it.category)}</td>
      <td>${escapeHtml(it.store_name)} ${it.city ? '(' + escapeHtml(it.city) + ')' : ''}</td>
      <td>${it.last_seen_price != null ? '€' + it.last_seen_price.toFixed(2) : '—'}</td>
      <td><span class="badge danger">${it.days_missing} days</span></td>
    </tr>
  `).join('');
  return `
    <table>
      <thead><tr><th>Product</th><th>Brand</th><th>Category</th><th>Store</th><th>Last seen price</th><th>Missing</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderChart(cats) {
  const ctx = document.getElementById('priceChart');
  if (!ctx) return;
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: cats.map(([name]) => name),
      datasets: [
        { label: "P&G avg price (€)", data: cats.map(([, v]) => v.pg_avg_price), backgroundColor: '#004b93' },
        { label: "Category avg price, all brands (€)", data: cats.map(([, v]) => v.avg_price), backgroundColor: '#9db8d1' },
      ],
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'bottom' } },
      scales: { y: { beginAtZero: true, title: { display: true, text: 'EUR' } } },
    },
  });
}

loadData();
</script>
</body>
</html>
