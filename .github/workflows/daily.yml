name: Daily price & assortment crawl

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawl and export
        run: python scrape_and_export.py

      - name: Commit updated data
        run: |
          git config user.name "pg-price-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/data.json docs/flags/ docs/products/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily price/assortment update $(date -u +%Y-%m-%d)"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
