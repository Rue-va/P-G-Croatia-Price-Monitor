name: Daily price & assortment crawl

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: write

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run crawl and export
        run: python scrape_and_export.py
      - name: Build Excel report
        run: python excel_report.py
      - name: Commit updated data
        run: |
          git config user.name "pg-price-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/data.json docs/flags/ docs/products/ docs/PG_Price_Report.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily price/assortment update $(date -u +%Y-%m-%d)"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

  deploy-pages:
    needs: crawl
    if: always() && (needs.crawl.result == 'success' || needs.crawl.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
