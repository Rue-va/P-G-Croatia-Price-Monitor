<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&G Croatia — Retail Price &amp; Assortment Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --pg-blue: #004b93;
    --bg: #f4f6f8;
    --card: #ffffff;
    --border: #dfe3e8;
    --text: #1c1f24;
    --muted: #6b7480;
    --danger: #c0392b;
    --danger-bg: #fdecea;
    --ok: #1e8e3e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--pg-blue);
    color: white;
    padding: 20px 28px;
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab-btn {
    padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
    background: white; cursor: pointer; font-size: 14px; color: var(--text);
  }
  .tab-btn.active { background: var(--pg-blue); color: white; border-color: var(--pg-blue); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px;
  }
  .card .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .card .value { font-size: 26px; font-weight: 600; margin-top: 4px; }
  .card .value.warn { color: var(--danger); }
  .section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 22px; }
  .section h2 { margin: 0 0 12px; font-size: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tr:hover td { background: #fafbfc; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .badge.danger { background: var(--danger-bg); color: var(--danger); }
  .status-line { font-size: 12px; color: var(--muted); margin-top: -8px; margin-bottom: 18px; }
  .status-pill { padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 6px; }
  .status-ok { background: #e6f4ea; color: var(--ok); }
  .status-stale { background: #fff4e5; color: #b06000; }
  .status-error { background: var(--danger-bg); color: var(--danger); }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
  canvas { max-height: 320px; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 20px; }
  .search-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  .search-row input {
    flex: 1; min-width: 220px; padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 14px;
  }
  .search-count { font-size: 12px; color: var(--muted); white-space: nowrap; }
  details.diagnostics { font-size: 13px; color: var(--muted); }
  details.diagnostics summary { cursor: pointer; color: var(--pg-blue); font-weight: 600; margin-bottom: 8px; }
  .diag-warning { background: #fff4e5; color: #b06000; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; }
  .brand-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .brand-tag { background: #eef1f4; border-radius: 4px; padding: 2px 8px; font-size: 12px; }
  .scroll-table { max-height: 480px; overflow-y: auto; }
</style>
</head>
<body>
<header>
  <h1>P&amp;G Croatia — Retail Price &amp; Assortment Monitor</h1>
  <p id="generated-line">Loading…</p>
</header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
</main>
<footer>
  Data source: retailers' legally-mandated public daily price lists (NN 75/2025). "Flagged" items are inferred as
  likely out of stock from N+ consecutive days missing from the published price list — this is not real warehouse
  inventory data.
</footer>

<script>
let dashboardData = null;
let activeRetailer = null;
let chartInstance = null;
let productsCache = {};   // retailer -> array of product rows (lazy-loaded)

async function loadData() {
  try {
    const res = await fetch('data.json?_=' + Date.now());
    dashboardData = await res.json();
    render();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="section"><p class="empty">Could not load data.json. If this is the first run, the daily job may not have completed yet.</p></div>';
  }
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function render() {
  const genLine = document.getElementById('generated-line');
  genLine.textContent = `Updated ${fmtDate(dashboardData.as_of_date)} · flags after ${dashboardData.missing_days_threshold}+ consecutive missing days`;

  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  dashboardData.retailers.forEach((r, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.textContent = r.retailer.charAt(0).toUpperCase() + r.retailer.slice(1);
    btn.onclick = () => selectRetailer(r.retailer, btn);
    tabs.appendChild(btn);
  });

  if (dashboardData.retailers.length) {
    activeRetailer = dashboardData.retailers[0].retailer;
    renderRetailer(activeRetailer);
  }
}

function selectRetailer(name, btnEl) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  activeRetailer = name;
  renderRetailer(name);
}

function statusPill(status) {
  if (status === 'ok') return '<span class="status-pill status-ok">up to date</span>';
  if (status === 'stale') return '<span class="status-pill status-stale">showing last good data</span>';
  return '<span class="status-pill status-error">crawl failed</span>';
}

function renderRetailer(name) {
  const r = dashboardData.retailers.find(x => x.retailer === name);
  const content = document.getElementById('content');
  if (!r) { content.innerHTML = '<div class="section"><p class="empty">No data.</p></div>'; return; }

  if (r.status === 'error') {
    content.innerHTML = `
      <div class="section">
        <h2>${name.charAt(0).toUpperCase() + name.slice(1)} ${statusPill(r.status)}</h2>
        <p class="empty">The crawler could not reach ${name}'s price list today, and there's no earlier snapshot to fall back on yet.</p>
        <p class="empty" style="font-family:monospace;">${(r.error || '').slice(0, 300)}</p>
      </div>`;
    return;
  }

  const cats = Object.entries(r.category_stats || {})
    .filter(([, v]) => v.pg_count > 0)
    .sort((a, b) => b[1].pg_count - a[1].pg_count)
    .slice(0, 10);

  const diag = r.diagnostics || {};
  const pgIsSuspiciouslyLow = r.pg_products_tracked === 0 || (diag.blank_brand_field_pct || 0) > 60;

  content.innerHTML = `
    <p class="status-line">Last updated ${fmtDate(r.last_updated)} ${statusPill(r.status)}</p>
    ${pgIsSuspiciouslyLow ? `<div class="diag-warning">⚠ P&amp;G products tracked looks unexpectedly low for this retailer. Open "Why so few P&amp;G matches?" below — most likely the brand column isn't populated the way we expect for this retailer's files.</div>` : ''}
    <div class="cards">
      <div class="card"><div class="label">Total catalog size</div><div class="value">${r.total_catalog_size.toLocaleString()}</div></div>
      <div class="card"><div class="label">P&amp;G products tracked</div><div class="value">${r.pg_products_tracked.toLocaleString()}</div></div>
      <div class="card"><div class="label">Stores covered</div><div class="value">${r.stores_count.toLocaleString()}</div></div>
      <div class="card"><div class="label">Flagged missing ${dashboardData.missing_days_threshold}+ days</div><div class="value ${r.flagged_count > 0 ? 'warn' : ''}">${r.flagged_count.toLocaleString()}</div></div>
    </div>

    <div class="section">
      <h2>P&amp;G vs. competitor average price (top categories by P&amp;G presence)</h2>
      <canvas id="priceChart"></canvas>
    </div>

    <div class="section">
      <h2>Flagged: likely out of stock (missing ${dashboardData.missing_days_threshold}+ consecutive published days)</h2>
      ${renderFlaggedTable(r.flagged_items)}
    </div>

    <div class="section">
      <h2>P&amp;G products tracked</h2>
      <div class="search-row">
        <input type="text" id="product-search" placeholder="Filter by product, brand, category, or store…">
        <span class="search-count" id="product-count"></span>
      </div>
      <div class="scroll-table"><table id="products-table"><thead>
        <tr><th>Product</th><th>Brand</th><th>Category</th><th>Store</th><th>Price</th></tr>
      </thead><tbody><tr><td colspan="5" class="empty">Loading…</td></tr></tbody></table></div>
    </div>

    <div class="section">
      <details class="diagnostics">
        <summary>Why so few P&amp;G matches? (brand-matching diagnostics)</summary>
        <p>${diag.blank_brand_field_pct != null ? `${diag.blank_brand_field_pct}% of ${name}'s rows today had no value in the brand column` : 'No diagnostic data yet'}
           ${diag.matched_via_product_name_fallback ? ` — ${diag.matched_via_product_name_fallback.toLocaleString()} of the P&amp;G matches above came from spotting a brand name inside the product title rather than the brand field, because the brand field was empty or didn't match.` : ''}
        </p>
        <p>Most common brand values actually seen in ${name}'s file today (use this to spot a P&amp;G brand spelled differently than expected in <code>config.py</code>'s <code>PG_BRANDS</code>):</p>
        <div class="brand-tags">
          ${(diag.top_brands_seen || []).map(([b, c]) => `<span class="brand-tag">${escapeHtml(b || '(blank)')} · ${c}</span>`).join('') || '<span class="empty">No data</span>'}
        </div>
      </details>
    </div>
  `;

  renderChart(cats);
  loadProducts(name);
}

async function loadProducts(retailer) {
  const tbody = document.querySelector('#products-table tbody');
  const countEl = document.getElementById('product-count');
  try {
    if (!productsCache[retailer]) {
      const res = await fetch(`products/${retailer}.json?_=` + Date.now());
      productsCache[retailer] = await res.json();
    }
    const rows = productsCache[retailer];
    const searchInput = document.getElementById('product-search');

    function renderRows(filterText) {
      const q = (filterText || '').trim().toLowerCase();
      const filtered = q
        ? rows.filter(p =>
            (p.product || '').toLowerCase().includes(q) ||
            (p.brand || '').toLowerCase().includes(q) ||
            (p.category || '').toLowerCase().includes(q) ||
            (p.store_name || '').toLowerCase().includes(q))
        : rows;
      const shown = filtered.slice(0, 300);
      countEl.textContent = `${filtered.length.toLocaleString()} match${filtered.length === 1 ? '' : 'es'}${filtered.length > 300 ? ' (showing first 300 — keep typing to narrow)' : ''}`;
      tbody.innerHTML = shown.length ? shown.map(p => `
        <tr>
          <td>${escapeHtml(p.product)}</td>
          <td>${escapeHtml(p.brand)}</td>
          <td>${escapeHtml(p.category)}</td>
          <td>${escapeHtml(p.store_name)}</td>
          <td>${p.price != null ? '€' + Number(p.price).toFixed(2) : '—'}</td>
        </tr>`).join('') : '<tr><td colspan="5" class="empty">No matches.</td></tr>';
    }

    renderRows('');
    searchInput.addEventListener('input', e => renderRows(e.target.value));
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">Could not load the product list for this retailer.</td></tr>';
  }
}

function renderFlaggedTable(items) {
  if (!items || !items.length) {
    return '<p class="empty">Nothing flagged right now.</p>';
  }
  const rows = items.map(it => `
    <tr>
      <td>${escapeHtml(it.product)}</td>
      <td>${escapeHtml(it.brand)}</td>
      <td>${escapeHtml(it.category)}</td>
      <td>${escapeHtml(it.store_name)} ${it.city ? '(' + escapeHtml(it.city) + ')' : ''}</td>
      <td>${it.last_seen_price != null ? '€' + it.last_seen_price.toFixed(2) : '—'}</td>
      <td><span class="badge danger">${it.days_missing} days</span></td>
    </tr>
  `).join('');
  return `
    <table>
      <thead><tr><th>Product</th><th>Brand</th><th>Category</th><th>Store</th><th>Last seen price</th><th>Missing</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderChart(cats) {
  const ctx = document.getElementById('priceChart');
  if (!ctx) return;
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: cats.map(([name]) => name),
      datasets: [
        { label: "P&G avg price (€)", data: cats.map(([, v]) => v.pg_avg_price), backgroundColor: '#004b93' },
        { label: "Competitor avg price, excl. P&G (€)", data: cats.map(([, v]) => v.competitor_avg_price), backgroundColor: '#9db8d1' },
      ],
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'bottom' } },
      scales: { y: { beginAtZero: true, title: { display: true, text: 'EUR' } } },
    },
  });
}

loadData();
</script>
</body>
</html>
